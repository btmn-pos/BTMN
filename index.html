<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bánh Tráng Mẹ Nhân – Quản lý</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4E8D2;--bg2:#FBF4E6;--card:#FFFBF2;--line:#E6D6B8;--ink:#3A3A3A;--mut:#7A6A58;--red:#C8372D;--clay:#A8532F;--fire:#E8782A;--ok:#4E9F6B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 'Be Vietnam Pro',sans-serif;padding-bottom:84px;font-variant-numeric:lining-nums tabular-nums}
h2,h3{font-family:'Baloo 2',sans-serif;font-weight:800;margin:0 0 6px}
header{background:var(--card);border-bottom:2px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header .lg{font:800 21px 'Baloo 2';color:var(--red);line-height:1}header small{display:block;font:500 12px Oswald;color:var(--clay);letter-spacing:.5px}
main{padding:12px;max-width:1100px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px #a8532f14}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--ink);min-height:48px}input[type=checkbox]{width:22px;min-height:22px}
button{font:700 16px 'Be Vietnam Pro';min-height:48px;padding:0 16px;border:0;border-radius:16px;background:var(--red);color:#fff;cursor:pointer}button.o{background:var(--bg2);color:var(--ink);border:1.5px solid var(--line)}button.s{min-height:38px;padding:0 12px;font-size:14px}
.g{display:grid;gap:8px}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.lab{font-size:13px;color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:24px}
.pg{grid-template-columns:repeat(2,1fr)!important}.pc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px;text-align:center;cursor:pointer;position:relative}
.im{width:92px;height:92px;border-radius:50%;border:5px solid #fff;background:var(--bg2);margin:0 auto 6px;display:grid;place-items:center;font-size:34px;box-shadow:0 2px 8px #0003;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}
.pr{color:var(--red);font-weight:700}.tag{position:absolute;top:8px;right:8px;background:var(--fire);color:#fff;font:700 11px Oswald;padding:2px 8px;border-radius:99px}.vs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.tem{background:linear-gradient(135deg,#C8372D,#8E1B22);color:#fff;border-radius:18px;padding:8px 14px;font:800 18px 'Baloo 2';margin-bottom:10px}
.ln{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}.tot{font:800 30px 'Baloo 2';color:var(--red)}.st{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-size:13px;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:12px;padding:6px 0;min-height:62px;display:grid;gap:0}nav button b{font-size:22px}nav button.on{color:var(--red);background:var(--bg2)}
.kpi{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}.kpi div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}.kpi b{display:block;font:800 21px 'Baloo 2'}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td,.tb th{padding:6px 4px;border-bottom:1px dashed var(--line);text-align:right}.tb td:first-child,.tb th:first-child{text-align:left}.sc{overflow-x:auto}
#modal{display:none;position:fixed;inset:0;background:#0007;z-index:9;overflow:auto;padding:14px}#modal .in{background:var(--card);max-width:460px;margin:auto;border-radius:20px;padding:14px}
#bill{color:#000;background:#fff;font:13px/1.35 'Be Vietnam Pro',monospace;padding:6px;margin:auto}#bill table{width:100%;border-collapse:collapse}#bill td{padding:2px 0;vertical-align:top}#bill .c{text-align:center}#bill hr{border:0;border-top:1px dashed #000}
.pc{display:flex;flex-direction:column;gap:6px;padding:10px 8px;cursor:default}.pc .im{width:76px;height:76px;margin:0 auto}.nm{font-weight:700;text-align:center;white-space:nowrap;font-size:clamp(11.5px,3.4vw,15px);letter-spacing:-.2px}
.vb{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;padding:0 12px;font-size:15px;background:var(--bg2);color:var(--ink);border:1.5px solid var(--line);border-radius:14px}.vb b{color:var(--red)}
.who{display:inline-block;color:#fff;border-radius:99px;padding:2px 12px;font-size:14px;font-weight:700}
@media(min-width:800px){.sellg{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}.kpi{grid-template-columns:repeat(4,1fr)}}
@media print{body{padding:0;background:#fff}body>*:not(#modal){display:none!important}#modal{display:block!important;position:static;background:none;padding:0}#modal .in{background:#fff;max-width:none;padding:0}.np{display:none!important}@page{margin:2mm}}
